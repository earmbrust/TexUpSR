name: CI

on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    uses: ./.github/workflows/windows-build.yml

  linux-compatibility:
    name: Linux x64 / ${{ matrix.compiler }} / C++17, 20, 23
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    # NVIDIA's development image supplies matching CUDA and TensorRT headers
    # and libraries. The hosted runner has no NVIDIA GPU.
    container:
      image: nvcr.io/nvidia/tensorrt:26.05-py3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and OpenCV development files
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang-18 cmake ninja-build libopencv-dev libgtest-dev
      - name: Build and test C++17, C++20, and C++23
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          if [[ "$COMPILER" == clang ]]; then
            export CC=clang-18 CXX=clang++-18
          else
            export CC=gcc CXX=g++
          fi
          for standard in 17 20 23; do
            echo "::group::${COMPILER} C++${standard}"
            build_dir="build-ci-linux-${COMPILER}-cpp${standard}"
            cmake -S . -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DTEXUP_CXX_STANDARD="$standard" \
              -DBUILD_TESTING=ON
            cmake --build "$build_dir" --parallel 2
            # GPU testing needs NVIDIA drivers and an assigned GPU; keep the
            # six CPU tests mandatory rather than treating GPU skip as PASS.
            ctest --test-dir "$build_dir" --output-on-failure -E '^gpu_inference$'
            echo "::endgroup::"
          done
